name: Generate CV PDFs

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/cv*.json'
      - 'docs/langs.json'
      - 'scripts/generate-pdfs.mjs'
      - '.github/workflows/render-cv.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: render-cv-pdfs-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Generate and publish PDFs from the latest main revision
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          published=false
          changed=false
          release_needed=false
          commit_sha=""
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B pdf-build origin/main

            source_epoch="$(git log -1 --format=%ct -- ':(glob)docs/cv*.json' docs/langs.json scripts/generate-pdfs.mjs)"
            if [ -z "$source_epoch" ]; then
              source_epoch="$(git log -1 --format=%ct)"
            fi
            export SOURCE_DATE_EPOCH="$source_epoch"
            export FORCE_SOURCE_DATE=1
            export TZ=UTC

            node scripts/generate-site.mjs --check
            node scripts/test-site.mjs
            node scripts/generate-pdfs.mjs

            git add docs/outputs/pdf/*.pdf
            if git diff --staged --quiet; then
              commit_sha="$(git rev-parse origin/main)"
              if [ "$(git log -1 --format=%s origin/main)" = "Auto-generate CV PDFs (run ${GITHUB_RUN_NUMBER})" ]; then
                release_needed=true
              fi
              published=true
              break
            fi

            git commit -m "Auto-generate CV PDFs (run ${GITHUB_RUN_NUMBER})"
            if git push origin HEAD:main; then
              changed=true
              release_needed=true
              commit_sha="$(git rev-parse HEAD)"
              published=true
              break
            fi

            echo "Main advanced while PDFs were rendering; retrying from the latest revision ($attempt/3)."
          done

          if [ "$published" != true ]; then
            echo "Unable to publish PDFs after three latest-main attempts." >&2
            exit 1
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN pushes do not trigger legacy Pages builds, so request one explicitly.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null

      - name: Create release with generated artifacts
        if: steps.publish.outputs.release_needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "auto-release-${{ github.run_number }}"
          name: "Automated Release ${{ github.run_number }}"
          target_commitish: ${{ steps.publish.outputs.commit_sha }}
          fail_on_unmatched_files: true
          body: |
            This release includes:
            - Updated CV PDFs for all supported languages
            - Latest debug APK build
          files: |
            docs/outputs/pdf/*.pdf
            docs/outputs/apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
